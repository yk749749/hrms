{% extends 'layout.html' %}
{% block title %}403 无权限{% endblock %}

{% block content %}
<div class="card" style="text-align:center;padding:60px 20px;">
    <div style="font-size:52px;color:#e5484d;"><span class="glyphicon glyphicon-ban-circle"></span></div>
    <h3 style="margin-top:16px;">没有访问权限</h3>
    <p class="text-muted">
        当前账号（{{ current_user.username }} / {{ current_user.role_names }}）没有访问该功能的权限。
        {% if required %}<br>需要权限：<code>{{ required }}</code>{% endif %}
    </p>
    <p style="margin-top:20px;">
        <a href="/" class="btn btn-primary">返回首页</a>
        <a href="{% url 'logout' %}" class="btn btn-default">切换账号</a>
    </p>
</div>
{% endblock %}
