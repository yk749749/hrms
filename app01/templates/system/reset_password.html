{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-head">
    <div><h3>{{ title }}</h3><div class="sub">新密码至少 6 位，保存后使用 Django 内置哈希存储</div></div>
    <div><a href="{% url 'user_list' %}" class="btn btn-default">返回列表</a></div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'includes/form.html' %}
                <button type="submit" class="btn btn-primary">保 存</button>
                <a href="{% url 'user_list' %}" class="btn btn-default">取 消</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
